objectives:
  - objective: Composición corporal
    target: Más definida, sin perseguir gran pérdida de peso
    measuredBy: Peso promedio + cintura + fotos
    frequency: Semanal / mensual
    priority: Alta
  - objective: Abdomen
    target: Mayor definición abdominal
    measuredBy: Cintura + fotos + rendimiento de core
    frequency: Mensual
    priority: Alta
  - objective: Tobillo
    target: Sin dolor, más estable y fuerte
    measuredBy: Dolor, balance, movilidad, calf raises
    frequency: Semanal
    priority: Alta
  - objective: Fuerza
    target: Progresar sin entrenar al fallo
    measuredBy: Reps + carga + RIR
    frequency: Cada sesión
    priority: Alta
  - objective: Adherencia
    target: Que el plan sea sostenible
    measuredBy: Sesiones + nutrición + sueño
    frequency: Semanal
    priority: Muy alta
keyRules:
  - rule: RIR
    detail: Dejar ~2 reps en reserva en las series de trabajo.
  - rule: Volumen
    detail: "Semanas 1–2: 2 series efectivas por ejercicio."
  - rule: Progresión
    detail: Sube la carga solo al dominar el tope de reps con buena técnica.
  - rule: Tobillo
    detail: Modificar o parar si aparece dolor relevante, hinchazón o inestabilidad.
  - rule: Cardio
    detail: Priorizar bici/elíptica/caminata estable; sin impacto al inicio.
  - rule: Nutrición
    detail: Déficit pequeño, proteína alta, comida real y flexibilidad 80/20.
  - rule: Revisión
    detail: Cada sábado revisar datos y ajustar, no improvisar volumen.
progressionRules:
  - rule: Doble progresión
    detail: Sube el peso SOLO cuando completes el extremo alto del rango en ambas series con técnica
      limpia y ~RIR2.
    example: "Jalón 20 kg: 12/12 RIR2 → probar siguiente placa."
  - rule: Si nuevo peso cae demasiado
    detail: Si el salto te lleva por debajo del rango o cerca del fallo, vuelve al peso anterior.
    example: 25 kg ×8 muy duro → 20 kg sigue siendo trabajo.
  - rule: No fallo
    detail: No hace falta fallar para tus objetivos; menos aún entrenando sola.
    example: Parar con 1–3 reps posibles.
  - rule: Series de aproximación
    detail: No cuentan como volumen efectivo y deben evitar fatigarte.
    example: 1 serie ligera antes de un ejercicio nuevo o pesado.
  - rule: Volumen
    detail: No añadir ejercicios/series solo para 'sentir más'. Primero progresar carga/reps.
    example: Tu meta no es maximizar tamaño.
  - rule: Dolor tobillo
    detail: Dolor agudo, hinchazón, bloqueo o que 'se vaya' repetidamente = no progresar y valorar
      fisioterapia.
    example: 0 dolor no prueba que el ligamento esté perfecto.
