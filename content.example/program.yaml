# Generic sample program.
#
# The real one lives in content/, which is gitignored — it is personal planning.
# This file exists so the repo builds and runs for anyone who clones it, and so
# the content schema has a public, readable reference.
#
# To use your own: put your files in content/ with these same shapes. The Vite
# alias picks content/ over content.example/ automatically when it exists.

meta:
  title: Programa de ejemplo
  startDate: 2026-01-05
  checkpointDate: 2026-05-15
  startWeightKg: null

phases:
  - id: 1
    name: Adaptación
    startDate: 2026-01-05
    endDate: 2026-02-01
    goal: Técnica y cargas base
    mainSets: 2
    accessorySets: 2
    targetRir: { min: 2, max: 3 }
    weeklyCardioMinutes: { min: 60, max: 90 }
    coreFrequency: 2×/sem
    ankleStage: Base
    advanceCriteria: Técnica estable y buena recuperación
  - id: 2
    name: Construcción
    startDate: 2026-02-02
    endDate: 2026-03-15
    goal: Progresión estable
    mainSets: 3
    accessorySets: 2
    targetRir: { min: 2, max: 2 }
    weeklyCardioMinutes: { min: 90, max: 120 }
    coreFrequency: 3×/sem
    ankleStage: Progreso
    advanceCriteria: Las cargas progresan sin dolor
  - id: 3
    name: Consolidación
    startDate: 2026-03-16
    endDate: 2026-04-26
    goal: Más fuerza manteniendo volumen moderado
    mainSets: 3
    accessorySets: 2
    targetRir: { min: 1, max: 2 }
    weeklyCardioMinutes: { min: 120, max: 150 }
    coreFrequency: 3×/sem
    ankleStage: Dinámica
    advanceCriteria: Buen rendimiento sostenido
  - id: 4
    name: Mantenimiento
    startDate: 2026-04-27
    endDate: null
    goal: Mantener y minimizar fatiga
    mainSets: [2, 3]
    accessorySets: 2
    targetRir: { min: 1, max: 2 }
    weeklyCardioMinutes: { min: 120, max: 180 }
    coreFrequency: 3×/sem
    ankleStage: Mantenimiento
    advanceCriteria: Ajustar según energía y recuperación

weekStructure:
  - weekday: monday
    block: Full Body A
    focus: Cuerpo completo
    hasStrength: true
    cardio: null
    hasCore: true
    hasAnkle: true
    intensity: RIR según fase
    notes: Sesión principal
  - weekday: tuesday
    block: Cardio + core
    focus: Gasto energético y core
    hasStrength: false
    cardio: 25–40 min
    hasCore: true
    hasAnkle: true
    intensity: RPE 4–6
    notes: Sin impacto al inicio
  - weekday: wednesday
    block: Full Body B
    focus: Cuerpo completo
    hasStrength: true
    cardio: null
    hasCore: true
    hasAnkle: true
    intensity: RIR según fase
    notes: Sesión principal
  - weekday: thursday
    block: Cardio suave
    focus: Condición
    hasStrength: false
    cardio: 25–40 min
    hasCore: false
    hasAnkle: true
    intensity: RPE 4–6
    notes: ''
  - weekday: friday
    block: Full Body C
    focus: Cuerpo completo
    hasStrength: true
    cardio: null
    hasCore: true
    hasAnkle: true
    intensity: RIR según fase
    notes: Sesión principal
  - weekday: saturday
    block: Recuperación activa
    focus: Movilidad y cardio suave
    hasStrength: false
    cardio: 25–45 min
    hasCore: false
    hasAnkle: false
    intensity: RPE 3–5
    notes: Solo si estás recuperada
  - weekday: sunday
    block: Descanso
    focus: Recuperación
    hasStrength: false
    cardio: null
    hasCore: false
    hasAnkle: false
    intensity: '—'
    notes: Descanso total

sessions:
  - id: full_body_a
    name: Full Body A
    weekday: monday
    exercises:
      - id: bicicleta
        name: Bicicleta
        order: 1
        setsByPhase: { 1: 1, 2: 1, 3: 1, 4: 1 }
        target: { kind: minutes, min: 8, max: 10 }
        load:
          startKg: null
          perSide: false
          relativeToBase: false
          bodyweight: false
          needsCalibration: false
          incrementKg: null
          raw: ''
        progression: Mantener RPE 4–5
        goal: Calentar
        isAnkle: false
      - id: prensa
        name: Prensa
        order: 2
        setsByPhase: { 1: 2, 2: 3, 3: 3, 4: [2, 3] }
        target: { kind: reps, min: 10, max: 12 }
        load:
          startKg: 5
          perSide: true
          relativeToBase: true
          bodyweight: false
          needsCalibration: false
          incrementKg: 5
          raw: +5 kg/lado
        progression: Doble progresión
        goal: Cuádriceps y glúteo
        isAnkle: true
      - id: remo-sentado
        name: Remo sentado
        order: 3
        setsByPhase: { 1: 2, 2: 3, 3: 3, 4: [2, 3] }
        target: { kind: reps, min: 10, max: 12 }
        load:
          startKg: null
          perSide: false
          relativeToBase: false
          bodyweight: false
          needsCalibration: true
          incrementKg: null
          raw: Calibrar
        progression: Doble progresión
        goal: Espalda y postura
        isAnkle: false
      - id: calf-raise
        name: Elevación de talón
        order: 4
        setsByPhase: { 1: 2, 2: [2, 3], 3: 3, 4: [2, 3] }
        target: { kind: reps, min: 12, max: 15 }
        load:
          startKg: null
          perSide: false
          relativeToBase: false
          bodyweight: true
          needsCalibration: false
          incrementKg: null
          raw: Peso corporal
        progression: Progresar a unilateral
        goal: Tobillo y gemelo
        isAnkle: true
      - id: balance-unilateral
        name: Equilibrio unilateral
        order: 5
        setsByPhase: { 1: 3, 2: 3, 3: 3, 4: [2, 3] }
        target: { kind: secondsPerSide, seconds: 30 }
        load:
          startKg: null
          perSide: false
          relativeToBase: false
          bodyweight: true
          needsCalibration: false
          incrementKg: null
          raw: ''
        progression: Menos oscilación, luego mayor dificultad
        goal: Propiocepción
        isAnkle: true

  - id: cardio_core
    name: Cardio + core
    weekday: tuesday
    exercises:
      - id: cardio-machine
        name: Bici o elíptica
        order: 1
        setsByPhase: { 1: 1, 2: 1, 3: 1, 4: 1 }
        target:
          kind: minutesByPhase
          byPhase:
            - { min: 25, max: 30 }
            - { min: 30, max: 35 }
            - { min: 35, max: 40 }
            - { min: 35, max: 45 }
        load:
          startKg: null
          perSide: false
          relativeToBase: false
          bodyweight: false
          needsCalibration: false
          incrementKg: null
          raw: ''
        progression: Subir 5 min según tolerancia
        goal: Cardio moderado
        isAnkle: false
      - id: dead-bug
        name: Dead bug
        order: 2
        setsByPhase: { 1: 2, 2: 2, 3: 2, 4: 2 }
        target: { kind: repsPerSide, min: 8, max: 10 }
        load:
          startKg: null
          perSide: false
          relativeToBase: false
          bodyweight: true
          needsCalibration: false
          incrementKg: null
          raw: ''
        progression: Más control o variante más difícil
        goal: Core
        isAnkle: false

  - id: full_body_b
    name: Full Body B
    weekday: wednesday
    exercises:
      - id: prensa
        name: Prensa
        order: 1
        setsByPhase: { 1: 2, 2: 3, 3: 3, 4: [2, 3] }
        target: { kind: reps, min: 10, max: 12 }
        load:
          startKg: 5
          perSide: true
          relativeToBase: true
          bodyweight: false
          needsCalibration: false
          incrementKg: 5
          raw: +5 kg/lado
        progression: Doble progresión
        goal: Pierna y glúteo
        isAnkle: true
      - id: jalon-al-pecho
        name: Jalón al pecho
        order: 2
        setsByPhase: { 1: 2, 2: 3, 3: 3, 4: [2, 3] }
        target: { kind: reps, min: 10, max: 12 }
        load:
          startKg: 20
          perSide: false
          relativeToBase: false
          bodyweight: false
          needsCalibration: false
          incrementKg: null
          raw: 20 kg
        progression: Doble progresión
        goal: Dorsal y postura
        isAnkle: false
      - id: calf-raise
        name: Calf raise
        order: 3
        setsByPhase: { 1: 2, 2: [2, 3], 3: 3, 4: [2, 3] }
        target: { kind: reps, min: 12, max: 15 }
        load:
          startKg: null
          perSide: false
          relativeToBase: false
          bodyweight: true
          needsCalibration: false
          incrementKg: null
          raw: Peso corporal
        progression: Unilateral cuando lo tolere
        goal: Tobillo
        isAnkle: true

objectives:
  - objective: Composición corporal
    target: Más definida, sin perseguir gran pérdida de peso
    measuredBy: Peso promedio + cintura + fotos
    frequency: Semanal / mensual
    priority: Alta
  - objective: Fuerza
    target: Progresar sin entrenar al fallo
    measuredBy: Reps + carga + RIR
    frequency: Cada sesión
    priority: Alta
  - objective: Adherencia
    target: Que el plan sea sostenible
    measuredBy: Sesiones + nutrición + sueño
    frequency: Semanal
    priority: Muy alta

keyRules:
  - rule: RIR
    detail: Deja unas 2 repeticiones en reserva en las series de trabajo.
  - rule: Progresión
    detail: Sube la carga solo al dominar el tope de reps con buena técnica.
  - rule: Revisión
    detail: Cada sábado revisa los datos y ajusta, no improvises volumen.

progressionRules:
  - rule: Doble progresión
    detail: >-
      Mantén el peso hasta completar el tope de reps en todas las series con técnica limpia y RIR
      cercano al objetivo de la fase; luego sube el incremento mínimo.
  - rule: No fallo
    detail: No busques repeticiones fallidas, especialmente en máquinas donde entrenas sola.
  - rule: Series efectivas
    detail: Las series ligeras de aproximación no cuentan como series de trabajo.
