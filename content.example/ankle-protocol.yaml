# Generic sample ankle protocol. See content.example/program.yaml for context.

baselineDate: 2026-01-04

baseline:
  - metric: Dolor durante sesión
    result: 0/10
    interpretation: Buena tolerancia
    initialGoal: Mantener ≤2/10
    notes: No diagnostica lesión estructural
  - metric: Movilidad knee-to-wall
    result: Menor que el lado sano
    interpretation: Déficit observable
    initialGoal: Reducir la diferencia
    notes: Medir en cm desde la próxima sesión
  - metric: Balance a una pierna
    result: 30 s / 30 s / 20 s
    interpretation: Fatiga y temblor
    initialGoal: 3×30 s con menos oscilación
    notes: ''

protocol:
  - stage: Base
    weeks: 1–2
    exercise: Knee-to-wall
    sets: 2
    target: { kind: repsPerSide, min: 8, max: 8 }
    frequency: 3×/sem
    progression: Aumentar distancia poco a poco
    stopSignal: Dolor relevante
    goal: Movilidad
    notes: El talón no despega
  - stage: Base
    weeks: 1–2
    exercise: Calf raise bilateral
    sets: 2
    target: { kind: reps, min: 12, max: 12 }
    frequency: 3×/sem
    progression: Llegar a 15 limpias
    stopSignal: Dolor o compensación
    goal: Gemelo y tobillo
    notes: 1 s arriba
  - stage: Base
    weeks: 1–2
    exercise: Balance a una pierna
    sets: 3
    target: { kind: secondsPerSide, seconds: 30 }
    frequency: 3×/sem
    progression: Menos temblor
    stopSignal: Dolor o caídas
    goal: Propiocepción
    notes: Cerca de un apoyo
  - stage: Progreso
    weeks: 3–4
    exercise: Calf raise unilateral con apoyo
    sets: 3
    target: { kind: reps, min: 8, max: 12 }
    frequency: 3×/sem
    progression: Más repeticiones
    stopSignal: Dolor
    goal: Fuerza unilateral
    notes: ''
  - stage: Dinámica
    weeks: 5–6
    exercise: Step-down bajo
    sets: 2
    target: { kind: repsPerSide, min: 8, max: 8 }
    frequency: 3×/sem
    progression: Más control
    stopSignal: Dolor o hinchazón
    goal: Control de la pierna
    notes: ''

safetyNotes:
  - >-
    Si aparecen dolor que aumenta, hinchazón persistente, bloqueo o episodios repetidos de que el
    tobillo se va, conviene una evaluación presencial con fisioterapia.
  - Este tracker sirve para seguir progreso; no reemplaza un diagnóstico clínico.
