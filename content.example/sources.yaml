notes:
  - El objetivo del Excel es ayudarte a crear hábitos medibles y ajustar el plan, no obligarte a
    perseguir un número específico de la báscula.
  - El rango calórico es un punto de partida opcional; se ajusta con tendencias de 2–3 semanas,
    energía, hambre y rendimiento.
  - Si el tobillo desarrolla dolor, hinchazón o episodios repetidos de inestabilidad, la prioridad
    es una evaluación profesional presencial.
programCriteria:
  - "Cada bloque de la rutina debe cumplir dos condiciones: estar respaldado por evidencia/guías
    serias y servir a un objetivo concreto del plan."
  - La rutina evita maximizar volumen de hipertrofia porque el objetivo es recomposición/definición,
    no maximizar tamaño muscular.
  - Full-body 3×/sem se usa por adherencia y frecuencia de estímulo; no porque sea superior a split
    cuando el volumen es igual.
  - El trabajo de tobillo se progresa por movilidad + fuerza + balance/control; dolor 0/10 no
    demuestra que no exista lesión estructural.
